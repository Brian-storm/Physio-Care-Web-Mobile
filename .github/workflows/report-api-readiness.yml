name: Check report API configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check report secret name without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHYSIOCARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=commonjs <<'JS'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('node', [
            'node_modules/wrangler/bin/wrangler.js', 'secret', 'list',
            '--config', 'wrangler.worker.jsonc',
          ], { encoding: 'utf8' });
          if (result.status !== 0) {
            console.error('Unable to check Worker secret names. No credentials or account metadata logged.');
            process.exit(1);
          }
          let secrets;
          try { secrets = JSON.parse(result.stdout); }
          catch { throw new Error('Unable to parse Worker secret names.'); }
          const configured = secrets.some(secret => secret.name === 'LLM_API_KEY');
          console.log('LLM_API_KEY configured on physiocare-demo: ' + configured);
          if (!configured) process.exitCode = 1;
          JS

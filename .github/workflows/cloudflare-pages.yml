name: Deploy PhysioCare Worker

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physiocare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Test Pages gateway
        run: npm run test:gateway
      - name: Build static demo
        run: npm run build:cloudflare
      - name: Check deployment credentials
        env:
          PHYSIOCARE_WORKER_API_TOKEN: ${{ secrets.PHYSIOCARE_WORKER_API_TOKEN }}
        run: |
          if [ -z "$PHYSIOCARE_WORKER_API_TOKEN" ]; then
            echo '::error::Add the PHYSIOCARE_WORKER_API_TOKEN repository secret scoped ONLY to the physiocare-demo Worker with Editor permission.'
            exit 1
          fi
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHYSIOCARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec8010aae582c44feffb276276eda6ce
        run: npx wrangler deploy --config wrangler.worker.jsonc

# PhysioCare — Docker Compose: runs frontend (Next.js :3000) + backend (FastAPI :8000)

version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"  # Host:8001 maps to Container:8000
    environment:
      - DATABASE_URL=sqlite:///./physiocare.db
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"  # Host:3001 maps to Next.js default Container:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001  # Matches host backend port
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  backend_data: